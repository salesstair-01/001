name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

jobs:
  test:
    name: vet, unit and integration tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && false)
      - run: go vet ./...
      - run: go test -race -timeout 20m ./...

  fault:
    name: fault injection (1000 seeds) and metamorphic test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fault-1000
      - name: metamorphic test, 100 seeds
        run: go test ./internal/kv -run Metamorphic -meta-runs 100 -meta-ops 500 -timeout 20m

  minio:
    name: MinIO tests, crash test, driver matrix, ORM suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # MinIO no longer publishes images or binaries; build the pinned release.
      - uses: actions/cache@v4
        with:
          path: ~/minio-bin
          key: minio-RELEASE.2025-04-22T22-12-26Z
      - name: start MinIO
        run: |
          [ -x ~/minio-bin/minio ] || GOBIN=~/minio-bin go install github.com/minio/minio@RELEASE.2025-04-22T22-12-26Z
          mkdir -p /tmp/minio-data
          ~/minio-bin/minio server /tmp/minio-data --address 127.0.0.1:9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
      - run: make test-minio
      - run: make crash-test
      - name: driver matrix (sqld and proxyd)
        run: |
          make build
          mkdir -p /tmp/s2z
          ./bin/kvd -listen 127.0.0.1:7070 -data /tmp/s2z/kv > /tmp/s2z/kvd.log 2>&1 &
          ./bin/sqld -listen 127.0.0.1:3306 -kv 127.0.0.1:7070 -partition 5001 > /tmp/s2z/sqld.log 2>&1 &
          ./bin/dird -listen 127.0.0.1:7000 -db /tmp/s2z/dir.db -spawn-kvd ./bin/kvd \
            -spawn-data /tmp/s2z/spawned > /tmp/s2z/dird.log 2>&1 &
          echo '[{"name":"acme","partition":5002,"users":{"app":"s3cret"}}]' > /tmp/s2z/tenants.json
          ./bin/proxyd -listen 127.0.0.1:3307 -tenants /tmp/s2z/tenants.json -domain db.test \
            -spawn-sqld ./bin/sqld -directory 127.0.0.1:7000 -warm 1 > /tmp/s2z/proxyd.log 2>&1 &
          sleep 3
          DRV_PORT=3306 scripts/drivers/run.sh
          DRV_PORT=3307 DRV_USER=app@acme DRV_PASSWORD=s3cret scripts/drivers/run.sh
      - name: ORM suite (SQLAlchemy + Alembic) on sqld and proxyd
        run: |
          ORM_PORT=3306 scripts/orm/run.sh
          ORM_PORT=3307 ORM_USER=app@acme ORM_PASSWORD=s3cret scripts/orm/run.sh
      - name: logs
        if: failure()
        run: tail -n 50 /tmp/s2z/*.log || true

  mysql-diff:
    name: differential tests against MySQL 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runner image ships MySQL 8.0 (root/root), stopped.
      - run: sudo systemctl start mysql
      - run: S2Z_MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/' go test ./internal/sqlengine -run MySQLDiff -diff-rounds 10 -timeout 30m

  sqllogictest:
    name: sqllogictest subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/slt/fetch.sh
      - name: run (fails below the recorded pass rate)
        run: |
          go run ./cmd/slt -summary /tmp/results.md -min-pass-rate "$(cat scripts/slt/min-pass-rate)" \
            $(grep -v '^#' scripts/slt/files.txt | sed 's|^|scripts/slt/test/|') 2>/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqllogictest-results
          path: /tmp/results.md
