name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, unit and integration tests (Go race, Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kvd-rs/target
          key: kvd-rs-${{ hashFiles('kvd-rs/Cargo.lock') }}
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && false)
      - run: go vet ./...
      - run: (cd kvd-rs && cargo fmt --check)
      - name: the MySQL test-suite runner's own tests (mtr)
        run: cd mtr && cargo fmt --check && cargo test --release
      - name: the owner's tests (kvd-rs)
        run: cd kvd-rs && cargo test --release
      # The Go tests run kvd on a local store directory (internal/kvtest).
      - run: make kvd
      - run: go test -race -timeout 20m ./...

  owner:
    name: owner fault injection (200 seeds), metamorphic test (100 seeds), SlateDB's tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kvd-rs/target
            kvd-rs/vendor/slatedb/target
            kvd-rs/vendor/slatedb-txn-obj/target
          key: kvd-rs-${{ hashFiles('kvd-rs/Cargo.lock', 'kvd-rs/vendor/slatedb/Cargo.lock') }}
      - run: make fault-runs
      - run: make metamorphic
      # SlateDB is vendored with changes to its open (kvd-rs/vendor/README.md).
      - run: make slatedb-test

  ceph:
    name: "on Ceph RGW (MicroCeph): S3 compatibility, KV suites, crash test, restore, scale to zero, drivers, ORM"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kvd-rs/target
          key: kvd-rs-${{ hashFiles('kvd-rs/Cargo.lock') }}
      # The same script developers use (scripts/ceph/microceph.sh).
      - run: make ceph-up
      - run: make build
      - name: S3 compatibility, KV suites over gRPC on S3
        run: |
          eval "$(scripts/ceph/microceph.sh env)"
          go test ./internal/objstore -run 'S3Compat|MinIO' -v
          go test ./internal/kvsuite -count=1 -v -meta-runs 20 -meta-ops 500
      - name: crash test
        run: |
          eval "$(scripts/ceph/microceph.sh env)"
          make crash-test
      - name: point-in-time restore
        run: |
          eval "$(scripts/ceph/microceph.sh env)"
          scripts/kvd-rs/restore-test.sh
      - name: scale to zero (dird spawns kvd; it suspends, exits, wakes)
        run: |
          eval "$(scripts/ceph/microceph.sh env)"
          ./bin/wakedemo -bin ./bin -idle 3s -rounds 3
      - name: driver matrix and ORM suite (sqld, and proxyd + dird)
        run: |
          eval "$(scripts/ceph/microceph.sh env)"
          mkdir -p /tmp/s2z
          ./bin/kvd -listen 127.0.0.1:7070 > /tmp/s2z/kvd.log 2>&1 &
          ./bin/sqld -listen 127.0.0.1:3306 -kv 127.0.0.1:7070 -partition 5001 > /tmp/s2z/sqld.log 2>&1 &
          ./bin/dird -listen 127.0.0.1:7000 -db /tmp/s2z/dir.db -spawn-kvd ./bin/kvd \
            -spawn-data /tmp/s2z/spawned > /tmp/s2z/dird.log 2>&1 &
          echo '[{"name":"acme","partition":5002,"users":{"app":"s3cret"}}]' > /tmp/s2z/tenants.json
          ./bin/proxyd -listen 127.0.0.1:3307 -tenants /tmp/s2z/tenants.json -domain db.test \
            -spawn-sqld ./bin/sqld -directory 127.0.0.1:7000 -warm 1 > /tmp/s2z/proxyd.log 2>&1 &
          sleep 3
          DRV_PORT=3306 scripts/drivers/run.sh
          DRV_PORT=3307 DRV_USER=app@acme DRV_PASSWORD=s3cret scripts/drivers/run.sh
          ORM_PORT=3306 scripts/orm/run.sh
          ORM_PORT=3307 ORM_USER=app@acme ORM_PASSWORD=s3cret scripts/orm/run.sh
      - name: logs
        if: failure()
        run: |
          tail -n 50 /tmp/s2z/*.log /tmp/s2z/spawned/*.log || true
          scripts/ceph/microceph.sh status || true

  mysql-diff:
    name: differential tests against MySQL 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kvd-rs/target
          key: kvd-rs-${{ hashFiles('kvd-rs/Cargo.lock') }}
      - run: make kvd
      # The runner image ships MySQL 8.0 (root/root), stopped.
      - run: sudo systemctl start mysql
      - run: S2Z_MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/' go test ./internal/sqlengine -run MySQLDiff -diff-rounds 10 -timeout 30m

  sqllogictest:
    name: sqllogictest subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kvd-rs/target
          key: kvd-rs-${{ hashFiles('kvd-rs/Cargo.lock') }}
      - run: make kvd
      - run: scripts/slt/fetch.sh
      - name: run (fails below the recorded pass rate)
        run: |
          go run ./cmd/slt -summary /tmp/results.md -min-pass-rate "$(cat scripts/slt/min-pass-rate)" \
            $(grep -v '^#' scripts/slt/files.txt | sed 's|^|scripts/slt/test/|') 2>/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqllogictest-results
          path: /tmp/results.md

  mysql-test-suite:
    name: MySQL 8.0.46 test suite subset (mtr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kvd-rs/target
            mtr/target
          key: mtr-${{ hashFiles('kvd-rs/Cargo.lock', 'mtr/Cargo.lock') }}
      - run: make build
      - run: scripts/mtr/fetch.sh
      - run: (cd mtr && cargo build --release)
      - name: run (fails below the recorded pass rate)
        run: |
          mtr/target/release/mtr -bin bin -timeout 180 -list scripts/mtr/files.txt -baseline scripts/mtr/baseline.txt \
            -summary /tmp/mtr-results.md -failures /tmp/mtr-failures.tsv \
            -min-pass-rate "$(cat scripts/mtr/min-pass-rate)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtr-results
          path: |
            /tmp/mtr-results.md
            /tmp/mtr-failures.tsv
