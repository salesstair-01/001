# An S3 store for local development. MinIO's repository is archived (see
# docs/object-stores.md); `make ceph-up` (MicroCeph) is the maintained
# option, and kvd -store-dir needs no object store at all.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  minio-data:
