[package]
name = "kvd"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
object_store = { version = "0.14", features = ["aws"] }
parking_lot = "0.12"
prost = "0.13"
rand = "0.9"
slatedb = "0.17.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protox = "0.7"
tonic-build = "0.12"
