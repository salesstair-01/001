[package]
name = "kvd"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
humantime = "2"
object_store = { version = "0.14", features = ["aws"] }
parking_lot = "0.12"
prost = "0.13"
rand = "0.9"
slatedb = "0.17.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protox = "0.7"
tonic-build = "0.12"

# SlateDB 0.17.0 with fewer object-store round trips when a database opens
# (vendor/README.md lists the changes).
[patch.crates-io]
slatedb = { path = "vendor/slatedb" }
slatedb-txn-obj = { path = "vendor/slatedb-txn-obj" }
